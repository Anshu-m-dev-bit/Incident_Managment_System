{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="update-card">

<h2>Update Incident #{{ incident.id }}</h2>

<form method="POST">

<div class="form-group">

<label>Service</label>

<input 
type="text" 
name="service" 
value="{{ incident.service }}" 
required
>

</div>


<div class="form-group">

<label>Severity</label>

<select name="severity" id="severity">

<option value="SEV1" {% if incident.severity=="SEV1" %}selected{% endif %}>SEV1</option>
<option value="SEV2" {% if incident.severity=="SEV2" %}selected{% endif %}>SEV2</option>
<option value="SEV3" {% if incident.severity=="SEV3" %}selected{% endif %}>SEV3</option>

</select>

</div>


<div class="form-group">

<label>Status</label>

<select name="status" id="status">

<option value="Open" {% if incident.status=="Open" %}selected{% endif %}>Open</option>
<option value="Investigating" {% if incident.status=="Investigating" %}selected{% endif %}>Investigating</option>
<option value="Mitigated" {% if incident.status=="Mitigated" %}selected{% endif %}>Mitigated</option>
<option value="Resolved" {% if incident.status=="Resolved" %}selected{% endif %}>Resolved</option>

</select>

</div>


<div class="form-group">

<label>Description</label>

<textarea 
name="description" 
rows="4"
>{{ incident.description }}</textarea>

</div>


<div class="button-row">

<button type="submit" class="update-btn">
Update Incident
</button>

<button 
type="button"
class="delete-btn"
onclick="confirmDelete()"
>
Delete
</button>

</div>

</form>

</div>

</div>


<style>

/* card */

.update-card{

max-width:600px;

margin:auto;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 6px 18px rgba(0,0,0,0.1);

}

.update-card h2{
margin-bottom:20px;
}


/* form */

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
font-weight:600;
margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{

width:100%;

padding:10px;

border-radius:6px;

border:1px solid #ccc;

font-size:14px;

}


/* buttons */

.button-row{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.update-btn{

background:#3498db;

color:white;

border:none;

padding:10px 16px;

border-radius:6px;

cursor:pointer;

}

.update-btn:hover{
background:#2980b9;
}


.delete-btn{

background:#e74c3c;

color:white;

border:none;

padding:10px 16px;

border-radius:6px;

cursor:pointer;

}

.delete-btn:hover{
background:#c0392b;
}

</style>


<script>

function confirmDelete(){

if(confirm("Are you sure you want to delete this incident?")){

window.location.href="/delete/{{ incident.id }}"

}

}

</script>

{% endblock %}
