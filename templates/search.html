{% extends "base.html" %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="dashboard">

<h1 class="title">Incident Search Dashboard</h1>

<div class="layout">

<!-- LEFT GRAPH -->

<div class="chart-card">
<h3>Severity Distribution</h3>
<canvas id="severityChart"></canvas>
</div>


<!-- SEARCH CARD -->

<div class="search-card">

<h2>Search Incident</h2>

<input
type="text"
id="iid"
placeholder="Enter Incident ID (INC-1001)"
required
>

<div class="buttons">

<button onclick="searchIncident('view')" class="view-btn">
View
</button>

<button onclick="searchIncident('update')" class="update-btn">
Update
</button>

</div>

</div>


<!-- RIGHT GRAPH -->

<div class="chart-card">
<h3>Status Distribution</h3>
<canvas id="statusChart"></canvas>
</div>

</div>

</div>


<style>

/* page */

.dashboard{

height:80vh;

display:flex;
flex-direction:column;
justify-content:center;

background:linear-gradient(135deg,#eef3f8,#dbe7f5);

padding:20px;

}


/* title */

.title{

text-align:center;

margin-bottom:35px;

font-size:30px;

font-weight:600;

}


/* layout */

.layout{

display:grid;

grid-template-columns:1fr 1fr 1fr;

gap:35px;

align-items:center;

}


/* chart cards */

.chart-card{

background:white;

padding:20px;

border-radius:14px;

box-shadow:0 8px 20px rgba(0,0,0,0.08);

height:280px;

display:flex;
flex-direction:column;
justify-content:center;

}

.chart-card h3{
text-align:center;
margin-bottom:10px;
}

.chart-card canvas{
height:200px !important;
width:100% !important;
}


/* search card */

.search-card{

background:white;

padding:35px;

border-radius:16px;

box-shadow:0 12px 30px rgba(0,0,0,0.1);

text-align:center;

}

.search-card h2{
margin-bottom:20px;
}

.search-card input{

width:100%;

padding:12px;

border-radius:8px;

border:1px solid #ccc;

margin-bottom:25px;

font-size:15px;

}


/* buttons */

.buttons{

display:flex;

gap:15px;

justify-content:center;

}

.view-btn{

background:#27ae60;

color:white;

border:none;

padding:12px 20px;

border-radius:8px;

cursor:pointer;

font-size:15px;

transition:0.2s;

}

.view-btn:hover{

transform:translateY(-2px);

background:#219150;

}

.update-btn{

background:#3498db;

color:white;

border:none;

padding:12px 20px;

border-radius:8px;

cursor:pointer;

font-size:15px;

transition:0.2s;

}

.update-btn:hover{

transform:translateY(-2px);

background:#2c80b9;

}

</style>


<script>

/* disable enter submission */

document.getElementById("iid").addEventListener("keypress", function(e){
if(e.key === "Enter"){
e.preventDefault();
}
});


/* redirect logic */

function searchIncident(operation){

let iid = document.getElementById("iid").value.trim();

if(iid === ""){
alert("Please enter an Incident ID");
return;
}

window.location.href = "/" + operation + "/" + iid;

}


/* severity chart */

new Chart(document.getElementById("severityChart"), {

type: "bar",

data: {
labels: ["SEV1","SEV2","SEV3"],
datasets: [{
data: [
{{ sev_counts["SEV1"] }},
{{ sev_counts["SEV2"] }},
{{ sev_counts["SEV3"] }}
],
backgroundColor: [
"#e74c3c",
"#f39c12",
"#3498db"
]
}]
},

options: {
responsive: true,
maintainAspectRatio: false,
plugins:{legend:{display:false}}
}

});


/* status chart */

new Chart(document.getElementById("statusChart"), {

type: "doughnut",

data: {

labels: ["Open","Investigating","Mitigated","Resolved"],

datasets: [{

data: [
{{ stat_counts["Open"] }},
{{ stat_counts["Investigating"] }},
{{ stat_counts["Mitigated"] }},
{{ stat_counts["Resolved"] }}
],

backgroundColor:[
"#e74c3c",
"#f1c40f",
"#3498db",
"#2ecc71"
]

}]

},

options:{
responsive:true,
maintainAspectRatio:false
}

});

</script>

{% endblock %}
