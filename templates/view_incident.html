{% extends "base.html" %}

{% block content %}

<div class="container">

<div class="incident-view-card">

<h2>Incident Details</h2>

<div class="detail-row">
<span class="label">Incident ID</span>
<span class="value">{{ incident.id }}</span>
</div>

<div class="detail-row">
<span class="label">Service</span>
<span class="value">{{ incident.service }}</span>
</div>

<div class="detail-row">
<span class="label">Status</span>
<span class="value status {{ incident.status|lower }}">
{{ incident.status }}
</span>
</div>

<div class="detail-row">
<span class="label">Severity</span>
<span class="value severity {{ incident.severity|lower }}">
{{ incident.severity }}
</span>
</div>

<div class="detail-row">
<span class="label">Created At</span>
<span class="value">{{ incident.created_at }}</span>
</div>

<div class="description-box">

<h3>Description</h3>

<p>
{{ incident.description }}
</p>

</div>

</div>

</div>

<style>

.container{

display:flex;
justify-content:center;
margin-top:40px;

}

/* main card */

.incident-view-card{

width:700px;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 8px 20px rgba(0,0,0,0.1);

}

.incident-view-card h2{

margin-bottom:25px;

}

/* detail rows */

.detail-row{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #eee;

}

.label{

font-weight:600;

color:#444;

}

.value{

font-weight:500;

}

/* description */

.description-box{

margin-top:25px;

}

.description-box h3{

margin-bottom:10px;

}

.description-box p{

background:#f7f7f7;

padding:15px;

border-radius:8px;

line-height:1.6;

}

/* severity colors */

.sev1{
color:#e74c3c;
font-weight:bold;
}

.sev2{
color:#e67e22;
font-weight:bold;
}

.sev3{
color:#3498db;
font-weight:bold;
}

/* status */

.status.open{
color:#e74c3c;
}

.status.investigating{
color:#f39c12;
}

.status.mitigated{
color:#2980b9;
}

.status.resolved{
color:#27ae60;
}

</style>

{% endblock %}
