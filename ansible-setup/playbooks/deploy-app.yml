- name: Deploy app to Kubernetes
  hosts: ec2
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3  # ensures the correct Python is used

  tasks:

    # -----------------------------
    # Step 1: Copy k8s files to EC2
    # -----------------------------
    - name: Copy k8s files to EC2
      copy:
        src: ../../k8s/
        dest: ~/k8s/

    # -----------------------------
    # Step 2: Install Python dependencies
    # -----------------------------
    - name: Ensure python3-pip is installed
      become: true
      apt:
        name: python3-pip
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Install Python Kubernetes library
      become: true
      pip:
        name:
          - kubernetes
          - openshift
        executable: /usr/bin/python3

    # -----------------------------
    # Step 3: Ensure OpenAI secret exists
    # -----------------------------
    - name: Ensure OpenAI API key secret exists in Kubernetes
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openai-secret
            namespace: default
          type: Opaque
          stringData:
            OPENAI_API_KEY: "{{ lookup('env', 'OPENAI_API_KEY') }}"

    # -----------------------------
    # Step 4: Apply Kubernetes deployment
    # -----------------------------
    - name: Apply Kubernetes deployment
      shell: |
        kubectl apply -f ~/k8s/deployment.yaml
        kubectl apply -f ~/k8s/service.yaml

    # -----------------------------
    # Step 5: Restart deployment so pods pick up updated secret
    # -----------------------------
    - name: Restart deployment
      kubernetes.core.k8s:
        kind: Deployment
        namespace: default
        name: incident-app
        state: restarted

    # -----------------------------
    # Optional: Wait for pods to be ready (recommended)
    # -----------------------------
    - name: Wait for deployment rollout to complete
      shell: kubectl rollout status deployment/incident-app --timeout=120s